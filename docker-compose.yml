services:
  db:
    image: postgres:16
    container_name: medicore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medicore
    ports:
      - "5432:5432"
    volumes:
      - medicore-db-data:/var/lib/postgresql/data

volumes:
  medicore-db-data: